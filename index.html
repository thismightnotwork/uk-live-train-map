<!doctype html><html lang="en-GB"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#07111f"/><meta name="description" content="Live UK train positions on an interactive map."/><link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" href="./favicon.svg" type="image/svg+xml"/><title>UK Live Train Map</title></head><body><main class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">↯</span><div><h1>UK Live Train Map</h1><p id="status">Starting…</p></div></div><div class="topbar-actions"><button id="refreshButton" class="button" type="button">Refresh</button><button id="locateButton" class="button button-secondary" type="button">Locate me</button></div></header><section id="map" aria-label="Live train map"></section><aside class="panel" aria-live="polite"><div class="panel-handle"></div><div id="panelContent"><h2>Live services</h2><p class="muted">Tap a train marker to see its route and signals.</p><div id="trainList" class="train-list"></div></div></aside><div class="legend"><span><i class="key train-key"></i>Train</span><span><i class="key route-key"></i>Route</span><span><i class="key signal-key"></i>Signal</span></div></main><script type="module" src="./src/main.js"></script></body></html>
